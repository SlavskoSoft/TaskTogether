<div class="auth-container">
  <div class="auth-card">
    <h2>{{ title$ | async }}</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">{{ emailLabel$ | async }}</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="Enter your email"
        />
      </div>

      <div class="form-group">
        <label for="password">{{ passwordLabel$ | async }}</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="Enter your password"
        />
      </div>

      <div class="form-group">
        <label for="role">{{ roleLabel$ | async }}</label>
        <select [(ngModel)]="role" name="role" id="role">
          <option value="Parent">{{ roleParent$ | async }}</option>
          <option value="Child">{{ roleChild$ | async }}</option>
        </select>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? (submittingBtn$ | async) : (submitBtn$ | async) }}
      </button>
    </form>

    <p *ngIf="error" class="error">{{ error }}</p>

    <p class="auth-link">
      {{ loginLink$ | async }} <a routerLink="/auth/login">{{ 'Login here' }}</a>
    </p>
  </div>
</div>
